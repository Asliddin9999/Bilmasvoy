name: Build Bilmasvoy APK and send to Telegram

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# Bir branch uchun faqat eng oxirgi yig‘ish jarayoni ishlaydi.
concurrency:
  group: bilmasvoy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Download and verify AI model
        run: bash scripts/download-model.sh

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK file
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bilmasvoy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Send APK to Telegram once per version
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.MrDeviceUZ_SenaristBotbilmasvoy }}
          TELEGRAM_PRIVATE_CHAT_ID: '1888242683'
          TELEGRAM_AGENTLAR_CHAT_ID: '-1004305554564'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read app version."
            exit 1
          fi
          TAG="bilmasvoy-v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Version $VERSION was already delivered. Skipping duplicate Telegram send."
            exit 0
          fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_PRIVATE_CHAT_ID" ] || [ -z "$TELEGRAM_AGENTLAR_CHAT_ID" ]; then
            echo "::error::Telegram bot token or chat IDs are missing."
            exit 1
          fi

          CAPTION="Bilmasvoy ${VERSION} — yangi APK yangilanishi. 80 ta COCO sinfi uchun mahalliy AI agentlari, barqaror ramka kuzatuvi."
          for CHAT_ID in "$TELEGRAM_PRIVATE_CHAT_ID" "$TELEGRAM_AGENTLAR_CHAT_ID"; do
            response=$(curl --fail --show-error --silent \
              --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              --form "chat_id=${CHAT_ID}" \
              --form "document=@app/build/outputs/apk/debug/app-debug.apk" \
              --form "caption=${CAPTION}")
            echo "$response" | jq -e '.ok == true' >/dev/null
            echo "Telegram confirmed delivery to chat ${CHAT_ID}."
          done

          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "Telegram confirmed delivery of version $VERSION to both chats."
